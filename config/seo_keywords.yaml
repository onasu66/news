# =============================================================================
# 知リポAI — SEO・キーワード方針（ここを編集＝狙いKWの変更）
# =============================================================================
# ・target_high_value … 記事選定の加点・救済に使う「狙いキーワード」
# ・auto_boost は自動ジョブが別途更新（管理画面 /admin/seo で確認）
# ・performance は Search Console から取得（/admin/seo の「GSCから取得」）
# ・記事本文の自動リライトはしない（加点リストの更新のみ）
#
# 【方針】2026-09-12 改訂
# サイトの看板は「AI・論文・研究の解説」。それに対して以前の設定は
# 人物照会語（年俸・移籍・結婚・身長）や野球指標（本塁打・打率）を加点しており、
# 芸能・スポーツ記事が低価値フィルタを通過してしまっていた。
# Search Console 上で「クロール済み - インデックス未登録」が157件に達した一因。
# 加点語を AI・研究・技術に集約し、看板と記事内容を一致させる。
# =============================================================================

