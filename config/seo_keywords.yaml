  - エンタメ

# タイトル除外パターン（正規表現の一部）。研究・論文カテゴリには適用しない
exclude_title_patterns: "号外|訃報|結果|スコア|芸能|ランキング|占い|星座|ゴシップ|breaking\\s*:?\\s*$|score|results|obituary|gossip"

