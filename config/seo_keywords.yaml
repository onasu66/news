# タイトル除外パターン（正規表現の一部）。研究・論文カテゴリには適用しない。
# 芸能・スポーツの人物照会型タイトルを明示的に弾く。
exclude_title_patterns: "号外|訃報|結果|スコア|芸能|ランキング|占い|星座|ゴシップ|熱愛|不倫|破局|離婚|交際|恋愛|噂|炎上|批判殺到|感動|話題沸騰|涙|絶賛|衝撃|驚き|かわいい|美人|イケメン|年俸|移籍|契約更改|優勝|敗戦|先発|登板|打線|本塁打|ホームラン|得点|試合結果|速報|ライブ配信|視聴率|出演|主演|グラビア|breaking\\s*:?\\s*$|score|results|obituary|gossip|rumou?r|dating|divorce"

