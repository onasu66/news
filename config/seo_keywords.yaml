# =============================================================================
# 知リポAI — SEO・キーワード方針（ここを編集＝狙いKWの変更）
# =============================================================================
# ・target_high_value … 記事選定の加点・救済に使う「狙いキーワード」
# ・auto_boost は自動ジョブが別途更新（管理画面 /admin/seo で確認）
# ・performance は Search Console のクエリを管理画面から貼り付け
# ・記事本文の自動リライトはしない（加点リストの更新のみ）
# =============================================================================

# サイト全体のデフォルト meta keywords（base.html）
