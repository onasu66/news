# サイトの看板（AI・研究）との一致を一般ニュースに要求する。
# これが無かったため「国内」「国際」カテゴリの記事は無条件で通過し、
# 台風・花火大会・企業人事といった記事が量産されていた。
#   enabled: false            … 従来の挙動に戻す
#   exempt_categories         … 無条件で通すカテゴリ
#   min_score_without_match   … 狙いKW不一致でも、このSEOスコア以上なら通す。
#                               0 = 不一致なら常に弾く（最も厳しい）
topical_focus:
  enabled: true
  exempt_categories:
    - 研究・論文
  min_score_without_match: 0

# 自動最適化ジョブのパラメータ
optimizer:
  lookback_days: 7
  min_article_hits: 2          # 直近記事での出現回数の下限
  max_auto_boost: 40           # auto_boost の上限件数
  require_trend_or_performance: true  # トレンド or 実績KWと交差したものだけ自動採用
  demote_after_days: 14        # この日数タッチされなければ auto_boost から外す候補
