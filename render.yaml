# Render Blueprint - ニュースサイト
# https://dashboard.render.com/ で New > Blueprint からこのファイルを指定してデプロイ

services:
  - type: web
    name: newsite
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh

    envVars:
      - key: PYTHON_VERSION
        # Render は PYTHON_VERSION を「完全なバージョン」で指定する必要があります
        value: "3.11.7"
      # 永続ストレージ。TURSO_DATABASE_URL があれば Turso (libSQL) を優先し、
      # 無ければ DATABASE_URL の Neon Postgres、どちらも無ければコンテナ内 SQLite（再起動で消える）。
      # 値は Render ダッシュボードの Environment で設定する（sync: false）。
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # - key: DATABASE_URL
      #   sync: false
      # 以下は任意。Render ダッシュボードの Environment で設定
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: DISABLE_RSS_AND_AI
      #   value: "false"  # true にすると定時の記事更新を停止
      # - key: ADMIN_SECRET
      #   sync: false
      # 管理画面セッション署名を ADMIN と分離する場合（任意）
      # - key: SESSION_SECRET
      #   sync: false
      - key: SITE_URL
        value: "https://tiripo-ai.site"
      # 公開HTMLのブラウザ/CDNキャッシュ秒（/topic, /, /news）。Neon負荷削減。0 で無効。
      # bot 巡回がそのまま DB 往復にならないよう有効化。
      - key: PUBLIC_HTML_CACHE_MAX_AGE_SEC
        value: "120"
      # - key: NEWS_REFRESH_INTERVAL
      #   value: "240"
      # 無料枠向けの省エネ推奨値（必要に応じて有効化）
      # 一覧キャッシュの DB 再同期。既定 30 分（=48回/日の全件ロード）は転送量を食うため 180 分へ。
      - key: NEWS_LIST_CACHE_SYNC_MINUTES
        value: "180"
      # - key: RSS_MIN_ADDED_PER_REFRESH
      #   value: "5"
      # - key: RSS_REFRESH_MAX_LOOPS
      #   value: "1"
      # - key: RSS_PROCESS_MAX_PER_BATCH
      #   value: "10"
